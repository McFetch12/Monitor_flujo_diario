<html lang="es">

<meta charset="utf-8">

<title>Cierre Operacional Diario</title>

<style>

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none} a:hover{color:var(--ink)}
input,select,button{font-family:inherit}
button{cursor:pointer}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.mono{font-family:"IBM Plex Mono",monospace}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:9px}
.hd{padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel2);font:600 12.5px 'IBM Plex Sans',sans-serif}
h2{margin:0;font:600 12.5px 'IBM Plex Sans',sans-serif}
.tab-btn{appearance:none;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--ink3);padding:9px 13px 10px;cursor:pointer;font:600 11.5px 'IBM Plex Sans',sans-serif;letter-spacing:.1px;white-space:nowrap}
.tab-btn:hover{color:var(--ink)}
.tab-btn.on{color:var(--ink);border-bottom-color:var(--accent)}
.lbl{font:500 9.5px 'IBM Plex Mono',monospace;letter-spacing:.7px;text-transform:uppercase;color:var(--ink3)}
table{width:100%;border-collapse:collapse;font:400 12px 'IBM Plex Sans',sans-serif}
th{text-align:left;padding:9px 10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font:500 9.5px 'IBM Plex Mono',monospace;letter-spacing:.6px;text-transform:uppercase;color:var(--ink3);background:var(--panel2)}
td{padding:10px;border-bottom:1px solid var(--line)}
tr:hover td{background:var(--panel2)}
.inp{background:var(--panel3);border:1px solid var(--line);border-radius:6px;color:var(--ink);padding:6px 8px;font:400 11.5px 'IBM Plex Mono',monospace}
.btn{height:34px;padding:0 14px;border:1px solid var(--line);border-radius:7px;background:transparent;color:var(--ink2);font:600 11.5px 'IBM Plex Sans',sans-serif}
.btn:hover{color:var(--ink);border-color:var(--line2)}
.btn.pri{border:0;background:var(--accent);color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:5px;font:600 10px 'IBM Plex Mono',monospace;letter-spacing:.4px;text-transform:uppercase}
.hidden{display:none!important}
</style>
</head>
<body>
<div style="min-height:100vh;padding:0 0 56px">

  <header style="position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:0 20px">
    <div style="display:flex;align-items:center;gap:18px;height:56px">
      <div style="display:flex;align-items:center;gap:10px;min-width:0">
        <div style="width:26px;height:26px;border-radius:6px;background:var(--accent);display:grid;place-items:center;font:700 12px 'IBM Plex Mono',monospace;color:#fff;flex:none">CO</div>
        <div style="min-width:0">
          <div style="font:600 13px/1.1 'IBM Plex Sans',sans-serif;letter-spacing:-.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Cierre Operacional Diario</div>
          <div style="font:400 10px/1.4 'IBM Plex Mono',monospace;color:var(--ink3);letter-spacing:.4px;text-transform:uppercase">Tablero ejecutivo · BI de proceso</div>
        </div>
      </div>
      <div style="flex:1"></div>
      <div style="display:flex;align-items:center;gap:8px;padding:5px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel2)">
        <span style="width:6px;height:6px;border-radius:50%;background:var(--ok);animation:pulse 2.4s ease-in-out infinite"></span>
        <span class="mono" style="font-size:10.5px;font-weight:500;color:var(--ink2);letter-spacing:.3px">SYNC <span id="sync">—</span></span>
      </div>
      <div style="display:flex;align-items:center;gap:6px;padding:4px;border:1px solid var(--line);border-radius:7px;background:var(--panel2)">
        <span class="mono" style="font-size:10.5px;font-weight:500;color:var(--ink3);padding-left:6px">FECHA</span>
        <span class="mono" id="fecha" style="font-size:11.5px;font-weight:600;color:var(--ink);padding-right:6px">—</span>
      </div>
      <button id="themeBtn" class="btn mono" style="height:30px;padding:0 11px;background:var(--panel2)">TEMA · OSCURO</button>
    </div>
    <nav id="tabs" style="display:flex;gap:2px;align-items:flex-end;margin-bottom:-1px"></nav>
  </header>

  <div style="padding:var(--pad) 20px 0;display:flex;flex-direction:column;gap:var(--pad)">
    <div id="err" class="hidden panel" style="border-left:3px solid var(--bad);padding:12px 16px;color:var(--bad);font:500 12px 'IBM Plex Sans'"></div>

    <section id="tab-tend" class="hidden"></section>
    <section id="tab-heat" class="hidden"></section>
    <section id="tab-crono" class="hidden"></section>
    <section id="tab-areas" class="hidden"></section>
    <section id="tab-config" class="hidden"></section>
  </div>
</div>

function hhmmMin(s){ const m=/^(\d{1,2}):(\d{2})/.exec(s||''); return m?(+m[1]*60+ +m[2]):null; }
function fmtDurMin(min){ if(min==null) return '—'; min=Math.round(min); const h=Math.floor(Math.abs(min)/60), m=Math.abs(min)%60; const s=h?h+'h '+String(m).padStart(2,'0')+'m':m+'m'; return min<0?('-'+s):s; }
function heatColor(v){
  if(v==null) return 'var(--panel3)';
  if(v<=0)  return 'rgba(63,178,127,'+(0.22+Math.min(0.5,-v/30)).toFixed(2)+')';
  if(v<=15) return 'rgba(226,167,44,'+(0.18+v/40).toFixed(2)+')';
  return 'rgba(224,88,74,'+Math.min(0.92,0.3+v/70).toFixed(2)+')';
}

// ===== Carga =====
async function cargar(){
  try{
    if(STATIC_MODE){
      DATA = EMBEDDED_DATA;   // build publicado: sin backend, nada que fetchear
    } else {
      const r = await fetch('/api/data'); DATA = await r.json();
    }
    IND = DATA.indicadores;
    $('#sync').textContent = (IND.generado||'').slice(11,16) || '—';
    $('#fecha').textContent = IND.hoy_fmt || '—';
    render();
  }catch(e){ $('#err').classList.remove('hidden'); $('#err').textContent='No se pudo cargar los datos: '+e; }
}

function tabsNav(){
  const nav = $('#tabs'); nav.innerHTML='';
  TABS.forEach(([id,label])=>{
    const b = el('button', null, label); b.className='tab-btn'+(TAB===id?' on':'');
    b.onclick=()=>{ TAB=id; render(); };
    nav.appendChild(b);
  });
}

function render(){
  tabsNav();
  ['resumen','tend','heat','crono','areas','config'].forEach(id=>{
    $('#tab-'+id).classList.toggle('hidden', TAB!==id);
  });
  if(TAB==='resumen') renderResumen();
  else if(TAB==='tend') renderTend();
  else if(TAB==='heat') renderHeat();
  else if(TAB==='crono') renderCrono();
  else if(TAB==='areas') renderAreas();
  else if(TAB==='config') renderConfig();
}

// ===== TENDENCIAS =====
function renderTend(){
  const c = $('#tab-tend'); c.innerHTML='';
  const grid = el('div','display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:var(--pad)');

  // Línea de duración total
  const t = IND.tendencia||{puntos:[]}; const pts = (t.puntos||[]).filter(p=>p.val!=null);
  const p1 = el('div','padding:14px 16px 8px;grid-column:1/-1'); p1.className='panel';
  p1.appendChild(el('div','display:flex;align-items:baseline;gap:12px;margin-bottom:14px',
    '<h2>Duración total del cierre · últimos '+ (IND.meta.ventana||20) +' días hábiles</h2><div style="flex:1"></div>'+
    '<span class="mono" style="font-size:10px;color:var(--ink3)">MIN · LÍNEA PUNTEADA = SLA '+(t.sla_min||'')+'</span>'));
  const vals = pts.map(p=>p.val); const lo=Math.min(t.sla_min,...vals)-15, hi=Math.max(t.sla_min,...vals)+15, H=240, W=1000;
  const yv = v => (H-14)-((v-lo)/((hi-lo)||1))*(H-34);
  const xv = i => (i/((pts.length-1)||1))*(W-4)+2;
  const line = pts.map((p,i)=>(i?'L':'M')+xv(i).toFixed(1)+' '+yv(p.val).toFixed(1)).join(' ');
  const slaY = yv(t.sla_min).toFixed(1);
  let svg = '<svg viewBox="0 0 1000 240" preserveAspectRatio="none" style="width:100%;height:240px;display:block">'+
    '<g stroke="var(--line)" stroke-width="1"><line x1="0" y1="40" x2="1000" y2="40"/><line x1="0" y1="100" x2="1000" y2="100"/><line x1="0" y1="160" x2="1000" y2="160"/><line x1="0" y1="220" x2="1000" y2="220"/></g>'+
    '<line x1="0" y1="'+slaY+'" x2="1000" y2="'+slaY+'" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="6 5"/>'+
    '<path d="'+line+' L998 226 L2 226 Z" fill="var(--accent)" opacity="0.13"/>'+
    '<path d="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>'+
    pts.map((p,i)=>'<circle cx="'+xv(i).toFixed(1)+'" cy="'+yv(p.val).toFixed(1)+'" r="3.5" fill="var(--panel)" stroke="'+(p.val>t.sla_min?'var(--bad)':'var(--ok)')+'" stroke-width="2.5"/>').join('')+
    '</svg>';
  p1.appendChild(el('div',null,svg));
  if(pts.length) p1.appendChild(el('div','display:flex;justify-content:space-between;padding:4px 0 10px;font:500 10px IBM Plex Mono;color:var(--ink3)',
    '<span>'+esc(pts[0].fecha)+'</span><span>'+esc(pts[pts.length-1].fecha)+'</span>'));
  grid.appendChild(p1);

  // Cierre por área (apilado Supply Chain -> CP -> Distribución), eje = horas desde
  // el inicio del proceso, con línea roja horizontal en la meta de cierre.
  const ca = IND.cumplimiento_areas||[];
  const inicioMin = hhmmMin(IND.proceso.inicio);
  const metaCierreMin = hhmmMin(IND.proceso.meta_cierre);
  const CH = 170;
  const maxMin = Math.max((metaCierreMin!=null&&inicioMin!=null)?(metaCierreMin-inicioMin):0,
                          ...ca.map(d=>d.total_min||0), 60) * 1.12;
  const pxPerMin = CH / (maxMin||1);
  const p2 = el('div','padding:14px 16px'); p2.className='panel';
  p2.appendChild(el('div','display:flex;align-items:baseline;gap:10px;margin-bottom:12px',
    '<h2>Cierre por área · últimos '+ca.length+' días</h2><div style="flex:1"></div>'+
    '<span class="mono" style="font-size:10px;color:var(--ink3)">HORAS DESDE '+esc(IND.proceso.inicio||'')+'</span>'));
  const chartWrap = el('div','position:relative;height:'+CH+'px');
  const bars = el('div','display:flex;align-items:flex-end;gap:3px;height:100%');
  ca.forEach(d=>{
    const colDia = el('div','flex:1;display:flex;flex-direction:column-reverse;height:100%;min-width:0;border-radius:3px 3px 0 0;overflow:hidden');
    (d.segs||[]).forEach(s=>{
      const hpx = Math.max(1, s.dur_min*pxPerMin);
      colDia.appendChild(el('div','width:100%;height:'+hpx.toFixed(1)+'px;background:'+s.color));
    });
    bars.appendChild(colDia);
  });
  chartWrap.appendChild(bars);
  if(metaCierreMin!=null && inicioMin!=null){
    const yb = (metaCierreMin-inicioMin)*pxPerMin;
    chartWrap.appendChild(el('div','position:absolute;left:0;right:0;bottom:'+yb.toFixed(1)+'px;border-top:1.5px solid var(--bad)'));
    chartWrap.appendChild(el('span','position:absolute;right:0;bottom:'+(yb+3).toFixed(1)+'px;font:600 9px IBM Plex Mono;color:var(--bad);background:var(--panel);padding:0 4px',
      'Objetivo '+esc(IND.proceso.meta_cierre)));
  }
  p2.appendChild(chartWrap);
  const areaColor={};
  ca.forEach(d=>(d.segs||[]).forEach(s=>{ areaColor[s.area]=s.color; }));
  // orden de leyenda = orden visual del apilado (abajo->arriba), no "primero visto"
  const ORDEN_AREAS_LEG = ['Supply Chain','CP','Distribución'];
  const areaOrder = ORDEN_AREAS_LEG.filter(a=>a in areaColor).concat(Object.keys(areaColor).filter(a=>!ORDEN_AREAS_LEG.includes(a)));
  const legAreas = el('div','display:flex;gap:14px;margin-top:10px;flex-wrap:wrap');
  areaOrder.forEach(a=>legAreas.appendChild(el('span','display:flex;align-items:center;gap:5px;font:500 10px IBM Plex Mono;color:var(--ink2)',
    '<i style="width:8px;height:8px;border-radius:2px;background:'+areaColor[a]+';display:block"></i>'+esc(a))));
  p2.appendChild(legAreas);
  if(ca.length) p2.appendChild(el('div','display:flex;justify-content:space-between;margin-top:6px;font:500 10px IBM Plex Mono;color:var(--ink3)',
    '<span>'+esc(ca[0].fecha)+'</span><span>'+esc(ca[ca.length-1].fecha)+'</span>'));
  grid.appendChild(p2);

  // Duración promedio por hito (de la ventana, no solo hoy)
  const p3 = el('div','padding:14px 16px'); p3.className='panel';
  p3.appendChild(el('h2',null,'Duración promedio por hito · últimos '+(IND.meta.ventana||20)+' días')); p3.lastChild.style.marginBottom='12px';
  const list = el('div','display:flex;flex-direction:column;gap:9px');
  (IND.aportes||[]).forEach(a=>{
    list.appendChild(el('div',null,
      '<div style="display:flex;justify-content:space-between;font:400 11px IBM Plex Sans;margin-bottom:4px"><span>'+esc(a.nombre)+'</span><span class="mono" style="font-weight:600;color:var(--ink2)">'+esc(a.txt)+'</span></div>'+
      '<div style="height:7px;border-radius:4px;background:var(--panel3);overflow:hidden"><div style="height:100%;width:'+a.pct+'%;background:'+band(a.estado)+';border-radius:4px"></div></div>'));
  });
  p3.appendChild(list); grid.appendChild(p3);
  c.appendChild(grid);
}

// ===== CRONOLOGÍA =====
function renderCrono(){
  const c = $('#tab-crono'); c.innerHTML='';
  const cr = IND.crono || {};
  const dias = cr.dias || [];
  const eje0 = cr.eje_inicio_min||0, eje1 = cr.eje_fin_min||(eje0+360);
  const pct = m => Math.max(0, Math.min(100, (m-eje0)/((eje1-eje0)||1)*100));

  const p = el('div','padding:14px 16px 18px'); p.className='panel';
  const head = el('div','display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px');
  head.appendChild(el('h2',null,'Cronología comparativa · últimos '+dias.length+' días'));
  head.appendChild(el('div','flex:1'));
  const leg = el('div','display:flex;gap:12px;flex-wrap:wrap');
  (IND.hitos||[]).forEach(h=>leg.appendChild(el('span','display:flex;align-items:center;gap:6px;font:500 10px IBM Plex Mono;color:var(--ink)','<i style="width:8px;height:8px;border-radius:2px;background:'+h.serie+';display:block"></i>'+esc(h.corto))));
  head.appendChild(leg); p.appendChild(head);

  // Grid: col1 fecha, col2 EJE ABSOLUTO de horas (fijo, no proporcional a cada día),
  // col3 cierre, col4 desv. Fila 1 = eje de horas; filas 2.. = un día cada una.
  // margin-top más grande de lo estrictamente necesario: deja aire arriba para el
  // tooltip flotante del crosshair (ver más abajo) sin pisar el título/leyenda.
  const grid = el('div','display:grid;grid-template-columns:96px 1fr 64px 58px;column-gap:10px;row-gap:6px;margin-top:38px;position:relative');
  const filas = [];   // {el: <track>, segs: [...]} por día, para el hit-test del crosshair

  // Cabecera (fila 1): altura fija con dos franjas -- arriba las horas del eje, abajo
  // (escalonadas en 2 niveles para que no se pisen) las referencias fijas (inicio,
  // horario de Preventa, meta cierre). La línea punteada de cada referencia arranca
  // JUSTO DEBAJO de esta cabecera (HEADER_H) y baja por todos los días.
  const HEADER_H = 44;
  const sp1=el('div'); sp1.style.gridColumn='1'; sp1.style.gridRow='1'; grid.appendChild(sp1);
  const axis = el('div','position:relative;height:'+HEADER_H+'px');
  axis.style.gridColumn='2'; axis.style.gridRow='1';
  (cr.marcas||[]).forEach(m=>axis.appendChild(el('span','position:absolute;top:0;left:'+pct(m.min).toFixed(2)+'%;transform:translateX(-50%);font:600 10px IBM Plex Mono;color:var(--ink);white-space:nowrap',esc(m.label))));
  (cr.referencias||[]).forEach((r,ri)=>{
    const x = pct(r.min);
    axis.appendChild(el('span','position:absolute;top:'+(16+(ri%2)*14)+'px;left:'+x.toFixed(2)+'%;transform:translateX(2px);font:600 9px IBM Plex Mono;color:var(--ink);white-space:nowrap;background:var(--panel2);padding:0 3px;border-radius:2px;border:1px solid var(--line)', esc(r.label)));
  });
  grid.appendChild(axis);
  const sp3=el('div'); sp3.style.gridColumn='3'; sp3.style.gridRow='1'; grid.appendChild(sp3);
  const sp4=el('div'); sp4.style.gridColumn='4'; sp4.style.gridRow='1'; grid.appendChild(sp4);

  dias.forEach((d,i)=>{
    const r = i+2;
    const lbl = el('div',null,'<div class="mono" style="font-size:11.5px;font-weight:600">'+esc(d.fecha)+'</div><div style="font:400 10px IBM Plex Sans;color:var(--ink3)">'+esc(d.dia)+'</div>');
    lbl.style.gridColumn='1'; lbl.style.gridRow=String(r); lbl.style.alignSelf='center';
    grid.appendChild(lbl);

    const track = el('div','position:relative;height:22px'); // sin fondo: lo en blanco es tiempo muerto real
    track.style.gridColumn='2'; track.style.gridRow=String(r); track.style.alignSelf='center';
    (d.segs||[]).forEach(s=>{
      const l = pct(s.ini_min), w = Math.max(0, pct(s.fin_min)-l);
      // "asomo": si este hito se solapa con el siguiente (llegó pasado el horario de
      // arranque del que sigue), se dibuja SIN recortar en altura (más alto) y por
      // detrás (z más bajo) -- el que sigue, dibujado encima a la altura normal, deja
      // ver un borde asomando arriba/abajo en la zona de solape.
      const inset = s.peek ? 0 : 2;
      const div = el('div');
      div.style.cssText = 'position:absolute;top:'+inset+'px;bottom:'+inset+'px;'+
        'left:calc('+l.toFixed(2)+'% + 1px);width:calc('+w.toFixed(2)+'% - 2px);'+
        'background:'+s.color+';border-radius:3px;z-index:'+s.z+';cursor:default';
      let atraso;
      if(s.desv_min==null) atraso = 'Sin meta definida';
      else if(s.desv_min>0) atraso = 'Atraso: '+s.desv_min+'′';
      else if(s.desv_min<0) atraso = 'Adelanto: '+Math.abs(s.desv_min)+'′';
      else atraso = 'Sin atraso (a tiempo)';
      div.title = s.nombre+' · '+(s.area||'Sin área')+'\nEnviado a las '+s.real+'\n'+atraso;
      track.appendChild(div);
    });
    grid.appendChild(track);
    filas.push({el: track, segs: d.segs||[]});

    const cierre = el('div'); cierre.className='mono'; cierre.textContent=d.cierre;
    cierre.style.cssText='font-size:11.5px;font-weight:600;text-align:right;grid-column:3;grid-row:'+r+';align-self:center';
    grid.appendChild(cierre);

    const desv = el('div'); desv.className='mono'; desv.textContent=d.desv;
    desv.style.cssText='font-size:11px;font-weight:600;text-align:right;color:'+col(d.estado)+';grid-column:4;grid-row:'+r+';align-self:center';
    grid.appendChild(desv);
  });

  // Líneas de referencia (las etiquetas ya se dibujaron en la cabecera): overlay que
  // abarca desde el FIN de la cabecera hasta la última fila de días.
  const refOverlay = el('div','position:relative;pointer-events:none');
  refOverlay.style.gridColumn='2'; refOverlay.style.gridRow='1 / '+(dias.length+2);
  (cr.referencias||[]).forEach(r=>{
    const x = pct(r.min);
    refOverlay.appendChild(el('div','position:absolute;top:'+HEADER_H+'px;bottom:0;left:'+x.toFixed(2)+'%;border-left:1px dashed var(--line2)'));
  });
  grid.appendChild(refOverlay);

  // Crosshair interactivo: al mover el mouse sobre el área de las barras, una línea
  // vertical delgada sigue el cursor y un tooltip arriba muestra la hora (según la
  // posición X, mapeada al eje) y qué hitos están activos en ESE momento para la fila
  // (día) que el mouse esté sobrevolando (según la posición Y). pointer-events:none en
  // el overlay para no tapar los tooltips nativos (title=...) de cada barra.
  const hoverOverlay = el('div','position:relative;pointer-events:none');
  hoverOverlay.style.gridColumn='2'; hoverOverlay.style.gridRow='1 / '+(dias.length+2);
  const hoverLine = el('div','position:absolute;top:0;bottom:0;width:1px;background:var(--ink);display:none;z-index:60');
  const hoverBox = el('div','position:absolute;top:0;transform:translate(-50%,-100%);margin-top:-6px;'+
    'background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:5px 10px;display:none;'+
    'font:500 10.5px "IBM Plex Mono",monospace;color:var(--ink);white-space:nowrap;z-index:61;text-align:center;'+
    'box-shadow:0 6px 16px rgba(0,0,0,.3)');
  hoverOverlay.appendChild(hoverLine); hoverOverlay.appendChild(hoverBox);
  grid.appendChild(hoverOverlay);

  const ocultarCrosshair = () => { hoverLine.style.display='none'; hoverBox.style.display='none'; };
  grid.addEventListener('mousemove', (e) => {
    const orect = hoverOverlay.getBoundingClientRect();
    if(orect.width<=0 || e.clientX<orect.left || e.clientX>orect.right || e.clientY<orect.top || e.clientY>orect.bottom){
      ocultarCrosshair(); return;
    }
    const relX = Math.max(0, Math.min(orect.width, e.clientX - orect.left));
    const minuto = eje0 + (relX/orect.width)*(eje1-eje0);
    const fila = filas.find(f => { const r=f.el.getBoundingClientRect(); return e.clientY>=r.top && e.clientY<=r.bottom; });
    const activos = fila ? fila.segs.filter(s => minuto>=s.ini_min && minuto<=s.fin_min).map(s=>s.nombre) : [];
    const h = Math.floor(minuto/60), m = Math.round(minuto%60);
    const horaTxt = String(h).padStart(2,'0')+':'+String(((m%60)+60)%60).padStart(2,'0');
    let html = '';
    if(fila) html += '<div style="color:var(--ink2);margin-bottom:2px">'+(activos.length?activos.map(esc).join(' · '):'Sin actividad')+'</div>';
    html += '<div style="font-weight:700">'+horaTxt+'</div>';
    hoverBox.innerHTML = html;
    hoverLine.style.left = relX+'px'; hoverLine.style.display='block';
    hoverBox.style.left = relX+'px'; hoverBox.style.display='block';
  });
  grid.addEventListener('mouseleave', ocultarCrosshair);

  p.appendChild(grid); c.appendChild(p);
}

// ===== ÁREAS =====
// Selección persistente (mientras dure la sesión de la página) de qué hito se ve en el
// panel de tendencia de cada área. Default pedido: Distribución -> Planificación de
// camiones; CP -> Pre-secuencia ajustada. Si el área tiene un solo hito, no hay selector.
const AREA_HITO_SEL = {};
const AREA_HITO_DEFAULT = {'Distribución': 'h06', 'CP': 'h04'};

function estadoDurLocal(dur, meta, tol){
  if(meta==null || dur==null) return 'sin';
  const d = dur-meta;
  if(d<=0) return 'ok';
  if(d<=tol) return 'warn';
  return 'bad';
}

function panelTendenciaArea(a, hitosArea){
  const panel = el('div','overflow:hidden'); panel.className='panel';
  const head = el('div','display:flex;align-items:center;gap:10px;flex-wrap:wrap'); head.className='hd';
  head.appendChild(el('span',null,esc(a.nombre)+' · duración por día'));
  head.appendChild(el('div','flex:1'));
  if(!AREA_HITO_SEL[a.nombre]){
    const def = AREA_HITO_DEFAULT[a.nombre];
    AREA_HITO_SEL[a.nombre] = (def && hitosArea.some(h=>h.id===def)) ? def : hitosArea[0].id;
  }
  if(hitosArea.length>1){
    const sel = el('select'); sel.className='inp'; sel.style.width='190px';
    hitosArea.forEach(h=>{ const o=el('option',null,esc(h.nombre)); o.value=h.id; if(h.id===AREA_HITO_SEL[a.nombre]) o.selected=true; sel.appendChild(o); });
    sel.onchange = e => { AREA_HITO_SEL[a.nombre]=e.target.value; render(); };
    head.appendChild(sel);
  } else {
    head.appendChild(el('span','font:500 11px IBM Plex Sans;color:var(--ink2)', esc(hitosArea[0].nombre)));
  }
  panel.appendChild(head);

  const hitoId = AREA_HITO_SEL[a.nombre];
  const serieCompleta = (IND.duraciones_hito||{})[hitoId] || [];
  const hitoObj = hitosArea.find(h=>h.id===hitoId) || {};
  const metaMin = hitoObj.dur_meta_min, tolMin = hitoObj.tol;
  const serie = serieCompleta.filter(x=>x.dur_min!=null);

  const body = el('div','padding:6px 16px 14px');
  if(!serie.length){
    body.appendChild(el('div','font:400 11.5px IBM Plex Sans;color:var(--ink3);padding:10px 0','Sin datos históricos todavía para este hito.'));
    panel.appendChild(body); return panel;
  }
  const maxVal = Math.max(metaMin||0, ...serie.map(x=>x.dur_min)) * 1.15 || 1;
  const rowsGrid = el('div','display:grid;grid-template-columns:52px 1fr 74px;column-gap:10px;row-gap:6px;position:relative');
  serie.forEach((x,i)=>{
    const r = i+1;
    const lbl = el('div'); lbl.className='mono'; lbl.textContent=x.fecha.slice(5).replace('-','/');
    lbl.style.cssText='font-size:10.5px;color:var(--ink3);grid-column:1;grid-row:'+r+';align-self:center';
    rowsGrid.appendChild(lbl);
    const track = el('div','position:relative;height:14px');
    track.style.gridColumn='2'; track.style.gridRow=String(r); track.style.alignSelf='center';
    const s = estadoDurLocal(x.dur_min, metaMin, tolMin);
    track.appendChild(el('div','position:absolute;top:0;bottom:0;left:0;width:'+(Math.max(0,Math.min(100,x.dur_min/maxVal*100))).toFixed(2)+'%;background:'+band(s)+';border-radius:3px'));
    rowsGrid.appendChild(track);
    const val = el('div'); val.className='mono'; val.textContent=x.dur;
    val.style.cssText='font-size:11px;font-weight:600;color:'+col(s)+';grid-column:3;grid-row:'+r+';align-self:center;text-align:right';
    rowsGrid.appendChild(val);
  });
  if(metaMin!=null){
    const refOv = el('div','position:relative;pointer-events:none');
    refOv.style.gridColumn='2'; refOv.style.gridRow='1 / '+(serie.length+1);
    refOv.appendChild(el('div','position:absolute;top:0;bottom:0;left:'+(Math.max(0,Math.min(100,metaMin/maxVal*100))).toFixed(2)+'%;width:0;border-left:1.5px solid var(--bad)'));
    rowsGrid.appendChild(refOv);
  }
  body.appendChild(rowsGrid);
  if(metaMin!=null) body.appendChild(el('div','margin-top:10px;font:500 10px IBM Plex Mono;color:var(--ink3)','┊ línea roja = meta ('+fmtDurMin(metaMin)+')'));
  panel.appendChild(body);
  return panel;
}

let HITOS_DRAFT = null;
function draftProc(){
  if(!HITOS_DRAFT) HITOS_DRAFT = JSON.parse(JSON.stringify(DATA.maestra_hitos||{procesos:{}}));
  if(!HITOS_DRAFT.procesos[IND.proceso_id]) HITOS_DRAFT.procesos[IND.proceso_id] = {hitos:[]};
  return HITOS_DRAFT.procesos[IND.proceso_id];
}

// origen "horario" usa su horario alternativo).

  if(!FESTIVOS_DRAFT) FESTIVOS_DRAFT = (DATA.maestra_festivos && DATA.maestra_festivos.fechas || []).slice();

// ===== Acciones =====
async function post(url, body){
  const r = await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
  const j = await r.json().catch(()=>({ok:false,error:'respuesta inválida'}));
  if(!r.ok||j.ok===false) throw new Error(j.error||('HTTP '+r.status));
  return j;
}
// Aviso visible (no bloqueante) de éxito/error al guardar -- antes no había NINGÚN
// feedback y no se sabía si el click realmente hizo algo.
let _toastTimer = null;
function toast(msg, tipo){
  let t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div'); t.id = 'toast';
    t.style.cssText = 'position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:999;'+
      'padding:10px 18px;border-radius:8px;font:600 12.5px "IBM Plex Sans",sans-serif;color:#fff;'+
      'box-shadow:0 6px 20px rgba(0,0,0,.35);transition:opacity .25s;opacity:0;pointer-events:none;white-space:nowrap';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.background = tipo==='error' ? 'var(--bad)' : 'var(--ok)';
  t.style.opacity = '1';
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(()=>{ t.style.opacity='0'; }, 2800);
}
function guardarHitos(){
  post('/api/maestra_hitos', HITOS_DRAFT).then(()=>{ HITOS_DRAFT=null; cargar(); toast('Mantenedor de hitos guardado ✓'); })
    .catch(e=>toast('Error al guardar: '+e.message, 'error'));
}
function guardarFestivos(){
  post('/api/maestra_festivos', {fechas: FESTIVOS_DRAFT||[]}).then(()=>{ FESTIVOS_DRAFT=null; cargar(); toast('Feriados guardados ✓'); })
    .catch(e=>toast('Error al guardar: '+e.message, 'error'));
}
function guardarConfig(){
  const body={toggles:{}};
  document.querySelectorAll('#tab-config input[data-k]').forEach(i=>{
    const k=i.dataset.k;
    if(k==='ventana') body.ventana = i.value.split(/[–-]/).map(s=>s.trim()).slice(0,2);
    else if(k==='intervalo_min'||k==='retencion_dias') body[k]=Number(i.value);
    else body[k]=i.value;
  });
  document.querySelectorAll('#tab-config [data-k][data-on]').forEach(s=>{ body.toggles[s.dataset.k]= s.dataset.on==='1'; });
  post('/api/config', body).then(()=>{ cargar(); toast('Configuración guardada ✓'); })
    .catch(e=>toast('Error al guardar: '+e.message, 'error'));
}
function actualizar(){
  post('/api/refresh',{dias:1}).then(()=>{ cargar(); toast('Actualizado con correo real ✓'); })
    .catch(e=>toast('Error al actualizar: '+e.message, 'error'));
}
function sembrarDemo(){
  post('/api/demo',{dias:24}).then(r=>{ cargar(); toast(r.agregadas+' capturas demo agregadas ✓'); })
    .catch(e=>toast('Error: '+e.message, 'error'));
}
function publicar(){
  toast('Publicando… puede tardar hasta un minuto');
  post('/api/publicar',{}).then(r=>{ cargar(); toast('Publicado ✓ · '+r.url); })
    .catch(e=>toast('Error al publicar: '+e.message, 'error'));
}

// ===== Tema =====
function initTema(){
  const b = $('#themeBtn');
  const set = t => { document.documentElement.dataset.theme=t; b.textContent='TEMA · '+(t==='dark'?'OSCURO':'CLARO'); try{localStorage.setItem('tema',t)}catch(e){} };
  let t='dark'; try{ t=localStorage.getItem('tema')||'dark'; }catch(e){}
  set(t); b.onclick=()=>set(document.documentElement.dataset.theme==='dark'?'light':'dark');
}

initTema(); cargar();
</script>
